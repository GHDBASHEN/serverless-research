name: Auto Release

on:
  push:
    tags:
      - 'v*' # This will trigger the workflow whenever you push a tag starting with 'v' (e.g., v0.1.0)

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Important: Grants permission to create the release

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Build Tools
        run: |
          python -m pip install --upgrade pip
          pip install setuptools wheel build

      - name: Build the .whl Package
        working-directory: ./cloudpredict
        run: python setup.py sdist bdist_wheel

      - name: Create Release and Upload .whl
        uses: softprops/action-gh-release@v2
        with:
          files: cloudpredict/dist/*.whl # Uploads the newly built wheel to the release page
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
